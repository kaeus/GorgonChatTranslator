name: build-release

# Builds the standalone .exe and publishes a GitHub Release on every push to
# main/master (skipping docs-only changes). The version is DERIVED FROM THE
# LATEST RELEASE -- the patch number is bumped off whatever release is currently
# newest -- so the exe's embedded version always matches its release tag, and
# the newest release is always surfaced by GitHub as "Latest".
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:      # allow manual "Run workflow" builds too

permissions:
  contents: write         # required to create releases / upload assets

concurrency:              # serialize builds so two pushes can't pick the same version
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compute next version from latest release
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          if [[ -z "$latest" ]]; then
            next="1.0.0"                       # no releases yet -> first version
          else
            ver="${latest#v}"                  # strip leading 'v'
            IFS='.' read -r MA MI PA <<< "$ver"
            next="${MA:-1}.${MI:-0}.$(( ${PA:-0} + 1 ))"   # bump patch
          fi
          echo "Next version: $next (latest release: ${latest:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Stamp version.txt
        shell: bash
        run: printf '%s' "${{ steps.ver.outputs.version }}" > version.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt

      - name: Generate icon
        run: python gen_icon.py

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean GorgonChatTranslator.spec

      - name: Name the versioned artifact
        shell: bash
        run: cp "dist/GorgonChatTranslator.exe" "dist/GorgonChatTranslator-v${{ steps.ver.outputs.version }}.exe"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/GorgonChatTranslator.exe
            dist/GorgonChatTranslator-v${{ steps.ver.outputs.version }}.exe
